<style>
:root {
  --primary: #d4a0a0;
  --primary-dark: #c48888;
  --primary-light: #f8e8e8;
  --bg: #fdf6f3;
  --card-bg: #ffffff;
  --text: #3d2c2c;
  --text-secondary: #8c7a7a;
  --text-muted: #b8a8a8;
  --border: #f0e0e0;
  --danger: #e88888;
  --success: #7cb89c;
  --shadow: 0 2px 16px rgba(180, 140, 140, 0.10);
  --shadow-hover: 0 4px 24px rgba(180, 140, 140, 0.16);
  --radius: 16px;
  --radius-sm: 10px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 16px);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
input, textarea, button, select { font-family: inherit; }

/* ── Header ── */
header {
  position: sticky; top:0; z-index:100;
  background: linear-gradient(135deg, #f8e8e8 0%, #fdf6f3 100%);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
header h1 { font-size:18px; font-weight:700; letter-spacing:0.5px; color:var(--primary-dark); }
.header-icon { font-size:24px; }

/* ── Main ── */
main { padding:16px; padding-bottom: calc(80px + var(--safe-bottom)); max-width:480px; margin:0 auto; }

/* ── Countdown ── */
.countdown-card {
  background: linear-gradient(135deg, #d4a0a0, #c48888);
  color: #fff; border-radius: var(--radius);
  padding: 20px 24px; margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(180, 100, 100, 0.25);
  position: relative; overflow: hidden;
}
.countdown-card::after {
  content:''; position:absolute; top:-30px; right:-30px;
  width:100px; height:100px; border-radius:50%;
  background: rgba(255,255,255,0.08);
}
.countdown-label { font-size:13px; opacity:0.85; letter-spacing:1px; }
.countdown-name { font-size:22px; font-weight:700; margin:4px 0; }
.countdown-days { font-size:48px; font-weight:800; line-height:1; }
.countdown-days small { font-size:16px; font-weight:400; opacity:0.8; }
.countdown-date { font-size:13px; opacity:0.7; margin-top:6px; }
.countdown-none { text-align:center; padding:12px; color:var(--text-muted); font-size:14px; }

/* ── Add Button ── */
.btn-add {
  display:flex; align-items:center; justify-content:center; gap:6px;
  width:100%; padding:14px;
  background: linear-gradient(135deg, #d4a0a0, #c48888);
  color:#fff; border:none; border-radius:var(--radius);
  font-size:16px; font-weight:600; letter-spacing:0.5px;
  cursor:pointer; margin-bottom:20px;
  box-shadow: 0 2px 12px rgba(180, 140, 140, 0.2);
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-add:active { transform:scale(0.98); box-shadow:0 1px 6px rgba(180,140,140,0.15); }

/* ── Customer List ── */
.customer-list { display:flex; flex-direction:column; gap:12px; }
.customer-card {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow);
  cursor:pointer; transition: transform 0.15s, box-shadow 0.15s;
  border: 1px solid transparent;
}
.customer-card:active { transform:scale(0.985); box-shadow:var(--shadow-hover); border-color:var(--border); }
.customer-card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.customer-name { font-size:17px; font-weight:700; color:var(--text); }
.customer-badge {
  font-size:11px; font-weight:600; padding:3px 10px; border-radius:20px;
  background: var(--primary-light); color: var(--primary-dark);
}
.customer-badge.urgent { background:#ffe0e0; color:#c44; }
.customer-meta { display:flex; flex-wrap:wrap; gap:10px; font-size:13px; color:var(--text-secondary); }
.customer-meta span { display:flex; align-items:center; gap:3px; }
.customer-tags { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.tag { font-size:11px; padding:2px 8px; border-radius:10px; background:#f5ecec; color:var(--text-secondary); }
.empty-state { text-align:center; padding:40px 20px; color:var(--text-muted); }
.empty-state .icon { font-size:48px; margin-bottom:12px; }
.empty-state p { font-size:14px; }

/* ── Detail Page ── */
.detail-page { display:none; }
.detail-page.active { display:block; }
.back-btn {
  display:flex; align-items:center; gap:4px;
  background:none; border:none; color:var(--primary-dark);
  font-size:15px; cursor:pointer; padding:8px 0; margin-bottom:16px;
}
.section-card {
  background:var(--card-bg); border-radius:var(--radius);
  padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow);
}
.section-title { font-size:14px; font-weight:700; color:var(--primary-dark); margin-bottom:12px; display:flex; align-items:center; gap:6px; letter-spacing:0.5px; }
.info-row { display:flex; padding:8px 0; border-bottom:1px solid #f8f0f0; font-size:14px; }
.info-row:last-child { border-bottom:none; }
.info-label { color:var(--text-secondary); width:72px; flex-shrink:0; }
.info-value { color:var(--text); flex:1; word-break:break-all; }
.info-value a { color:var(--primary-dark); text-decoration:none; }
.requirements-text { font-size:14px; line-height:1.7; color:var(--text); white-space:pre-wrap; }

/* ── Image Grid ── */
.image-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.image-item {
  aspect-ratio:3/4; border-radius:var(--radius-sm); overflow:hidden;
  background:#f5ecec; position:relative; cursor:pointer;
  border: 2px solid transparent; transition:border-color 0.2s;
}
.image-item img { width:100%; height:100%; object-fit:cover; }
.image-item-label { position:absolute; bottom:0; left:0; right:0; padding:4px 6px; background:rgba(0,0,0,0.5); color:#fff; font-size:10px; text-align:center; }
.image-item-delete {
  position:absolute; top:4px; right:4px;
  width:22px; height:22px; border-radius:50%;
  background:rgba(0,0,0,0.5); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; cursor:pointer; border:none;
}
.image-add {
  display:flex; align-items:center; justify-content:center;
  background:var(--primary-light); border:2px dashed var(--primary);
  cursor:pointer; font-size:28px; color:var(--primary);
  aspect-ratio:3/4; border-radius:var(--radius-sm);
  transition:background 0.15s;
}
.image-add:active { background:#f0d8d8; }

/* ── Form ── */
.form-page { display:none; }
.form-page.active { display:block; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; letter-spacing:0.5px; }
.form-group label .required { color:var(--danger); margin-left:2px; }
.form-input {
  width:100%; padding:12px 14px; border:1.5px solid var(--border);
  border-radius:var(--radius-sm); font-size:15px; color:var(--text);
  background:#fff; outline:none; transition:border-color 0.2s;
  -webkit-appearance:none;
}
.form-input:focus { border-color:var(--primary); }
.form-input::placeholder { color:var(--text-muted); }
textarea.form-input { min-height:100px; resize:vertical; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* ── Style Tags ── */
.style-tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
.style-tag {
  font-size:13px; padding:6px 14px; border-radius:20px;
  border:1.5px solid var(--border); background:#fff;
  color:var(--text-secondary); cursor:pointer; transition:all 0.15s;
}
.style-tag.selected { background:var(--primary-light); border-color:var(--primary); color:var(--primary-dark); }

/* ── Buttons ── */
.btn {
  padding:12px 24px; border-radius:var(--radius-sm); border:none;
  font-size:15px; font-weight:600; cursor:pointer; transition:transform 0.15s;
}
.btn:active { transform:scale(0.97); }
.btn-primary { background:linear-gradient(135deg, #d4a0a0, #c48888); color:#fff; width:100%; }
.btn-danger { background:#fff; color:var(--danger); border:1.5px solid var(--danger); }
.btn-export { background:#fff; color:var(--success); border:1.5px solid var(--success); }
.btn-group { display:flex; gap:10px; margin-top:16px; }
.btn-group .btn { flex:1; }

/* ── Modal ── */
.modal-overlay {
  display:none; position:fixed; inset:0; z-index:1000;
  background:rgba(0,0,0,0.85); justify-content:center; align-items:center;
}
.modal-overlay.active { display:flex; }
.modal-overlay img { max-width:90vw; max-height:80vh; border-radius:8px; }
.modal-close { position:absolute; top:20px; right:20px; color:#fff; font-size:28px; cursor:pointer; background:none; border:none; }

/* ── Bottom Nav ── */
.bottom-nav {
  position:fixed; bottom:0; left:0; right:0; z-index:99;
  background:rgba(255,255,255,0.95); backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  display:flex; padding:8px 0 var(--safe-bottom);
}
.bottom-nav button {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  background:none; border:none; color:var(--text-muted); font-size:11px;
  cursor:pointer; padding:4px 0; transition:color 0.15s;
}
.bottom-nav button.active { color:var(--primary-dark); }
.bottom-nav button .nav-icon { font-size:20px; }

/* ── Toast ── */
.toast {
  position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:2000;
  background:#3d2c2c; color:#fff; padding:12px 24px; border-radius:24px;
  font-size:14px; box-shadow:0 4px 16px rgba(0,0,0,0.2);
  opacity:0; transition:opacity 0.3s; pointer-events:none;
}
.toast.show { opacity:1; }

/* ── Search ── */
.search-wrap { position:relative; margin-bottom:16px; }
.search-wrap input {
  width:100%; padding:10px 14px 10px 36px; border:1.5px solid var(--border);
  border-radius:24px; font-size:14px; background:#fff; outline:none;
}
.search-wrap input:focus { border-color:var(--primary); }
.search-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:16px; }

/* ── Storage Bar ── */
.storage-bar {
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-size:11px; color:var(--text-muted); margin-top:12px; padding:8px;
}
.storage-bar button {
  background:none; border:none; color:var(--primary-dark); font-size:11px;
  cursor:pointer; text-decoration:underline;
}

@media (max-width:380px) {
  main { padding:12px; padding-bottom: calc(72px + var(--safe-bottom)); }
  .countdown-card { padding:16px 20px; }
  .countdown-days { font-size:40px; }
}
</style>
</head>

  <span class="header-icon">💄</span>
  <h1>跟妆顾客工作台</h1>
  <span style="width:24px"></span>

<div class="toast" id="toast"></div>

<!-- ====== 首页 ====== -->
<main id="homePage">
  <div class="countdown-card" id="countdownCard">
    <div class="countdown-label">⏰ 最近跟妆</div>

  </div>
  <button class="btn-add" onclick="openForm()">➕ 新增顾客</button>

  <div class="customer-list" id="customerList"></div>

  </div>
  <div class="storage-bar">

<!-- ====== 详情页 ====== -->
<main class="detail-page" id="detailPage">

<!-- ====== 表单页 ====== -->

  <button class="back-btn" onclick="goHome()">← 返回</button>

    <div class="form-group">

        <span class="style-tag" data-tag="需要妈妈妆">需要妈妈妆</span>
        <span class="style-tag" data-tag="需要伴娘妆">需要伴娘妆</span>
        <span class="style-tag" data-tag="伴郎1位">伴郎1位</span>
        <span class="style-tag" data-tag="伴郎2位">伴郎2位</span>
        <span class="style-tag" data-tag="伴郎3位">伴郎3位</span>
        <span class="style-tag" data-tag="伴郎4位">伴郎4位</span>
        <span class="style-tag" data-tag="伴郎5位">伴郎5位</span>
        <span class="style-tag" data-tag="伴娘1位">伴娘1位</span>
        <span class="style-tag" data-tag="伴娘2位">伴娘2位</span>
        <span class="style-tag" data-tag="伴娘3位">伴娘3位</span>
        <span class="style-tag" data-tag="伴娘4位">伴娘4位</span>
        <span class="style-tag" data-tag="伴娘5位">伴娘5位</span>

    <div class="form-group">
      <label>详细要求</label>

  </div>

  <input type="hidden" id="formCustomerId" value="">
  <button class="btn btn-primary" onclick="saveCustomer()" id="formSaveBtn">💾 保存顾客信息</button>
  <div class="btn-group">
    <button class="btn btn-danger" id="formDeleteBtn" style="display:none" onclick="deleteCustomer()">🗑 删除顾客</button>
  </div>
</main>

<!-- ====== 图片大图弹窗 ====== -->
<div class="modal-overlay" id="imageModal" onclick="closeModal()">
  <button class="modal-close">&times;</button>
  <img id="modalImage" src="" alt="">
</div>

<!-- ====== 底部导航 ====== -->
<nav class="bottom-nav" id="bottomNav">
  <button class="active" onclick="goHome()"><span class="nav-icon">🏠</span>首页</button>
  <button onclick="openForm()"><span class="nav-icon">➕</span>新增</button>
</nav>

<script>
// ============================================================
// 数据存储引擎 — GitHub API + localStorage 缓存
// ============================================================
const GITHUB_OWNER = 'z7k9nrm274-arch';
const GITHUB_REPO = 'makeup-workbench';
const GITHUB_DATA_FILE = 'data.json';
const GITHUB_API_BASE = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_DATA_FILE}`;

function getGitHubToken() {
  let token = localStorage.getItem('gh_token');
  if (!token) {
    token = prompt('请输入 GitHub Token（只需输入一次，会保存在本地）：\n\n打开此链接获取 Token：https://github.com/settings/tokens/new\n勾选 repo 权限即可');
    if (token && token.trim()) {
      token = token.trim();
      localStorage.setItem('gh_token', token);
    }
  }
  return token;
}

const STORAGE_KEY = 'makeup_workbench_customers';

async function loadAll() {
  // 先从 localStorage 读取缓存数据
  let cached = [];
  try { cached = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch(e) { cached = []; }

  // 异步从 GitHub API 读取最新数据
  try {
    const resp = await fetch(GITHUB_API_BASE, {
      headers: {
        'Authorization': `Bearer ${getGitHubToken()}`,
        'Accept': 'application/vnd.github+json'
      }
    });
    if (resp.ok) {
      const fileData = await resp.json();
      const content = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, ''))));
      const data = JSON.parse(content);
      if (Array.isArray(data)) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return data;
      }
    }
  } catch(e) {
    console.warn('GitHub API 读取失败，使用本地缓存:', e);
  }
  return cached;
}

async function saveAll(customers) {
  // 先存 localStorage 作为本地缓存
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(customers));
  } catch(e) {
    if (e.name === 'QuotaExceededError') {
      showToast('存储空间不足，请清理一些图片或旧记录');
    }
  }

  // 异步上传到 GitHub API
  try {
    // 先 GET 获取 sha
    let sha = null;
    const getResp = await fetch(GITHUB_API_BASE, {
      headers: {
        'Authorization': `Bearer ${getGitHubToken()}`,
        'Accept': 'application/vnd.github+json'
      }
    });
    if (getResp.ok) {
      const fileData = await getResp.json();
      sha = fileData.sha;
    }

    // base64 编码内容
    const content = btoa(encodeURIComponent(JSON.stringify(customers)).replace(/%([0-9A-F]{2})/g, (m,p)=>String.fromCharCode('0x'+p)));

    // PUT 更新文件
    const putResp = await fetch(GITHUB_API_BASE, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${getGitHubToken()}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: '更新数据',
        content: content,
        ...(sha ? { sha: sha } : {})
      })
    });
    if (!putResp.ok) {
      console.warn('GitHub API 保存失败:', await putResp.text());
    }
  } catch(e) {
    console.warn('GitHub API 保存失败:', e);
  }
}

// 同步读取本地缓存（用于不需要等待 GitHub 的场景）
function loadCached() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch(e) { return []; }
}

function getStorageSize() {
  let total = 0;
  for (let key in localStorage) {
    if (localStorage.hasOwnProperty(key)) {
      total += localStorage[key].length * 2; // UTF-16
    }
  }
  return total;
}

// ============================================================
// 工具函数
// ============================================================
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function daysLeft(dateStr) {
  if (!dateStr) return null;
  const wd = new Date(dateStr + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.ceil((wd - today) / 86400000);
}

function esc(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// 全局状态
// ============================================================
let currentPage = 'home';
let currentCustomerId = null;
let selectedTags = [];

// ============================================================
// 页面切换
// ============================================================
function showPage(page) {
  currentPage = page;
  document.getElementById('homePage').style.display = page === 'home' ? '' : 'none';
  document.getElementById('detailPage').classList.toggle('active', page === 'detail');
  document.getElementById('formPage').classList.toggle('active', page === 'form');
  const navBtns = document.querySelectorAll('.bottom-nav button');
  navBtns.forEach((b, i) => {
    b.classList.toggle('active', (page === 'home' && i === 0) || (page === 'form' && i === 1));
  });
}

function goHome() { showPage('home'); loadCustomers(); }

function openForm(customerId) {
  showPage('form');
  resetForm();
  if (customerId) loadCustomerToForm(customerId);
}

// ============================================================
// Toast
// ============================================================
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

function resetToken() {
  localStorage.removeItem('gh_token');
  showToast('Token 已清除，请重新输入');
  loadCustomers();
}

// ============================================================
// 顾客列表
// ============================================================
async function loadCustomers() {
  let customers = await loadAll();
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  if (search) customers = customers.filter(c => c.name.toLowerCase().includes(search));

  // 计算 days_left
  customers.forEach(c => { c.days_left = daysLeft(c.wedding_date); });
  // 按婚期排序
  customers.sort((a,b) => {
    if (!a.wedding_date) return 1;
    if (!b.wedding_date) return -1;
    return a.wedding_date.localeCompare(b.wedding_date);
  });

  renderCustomerList(customers);
  renderCountdown(customers);
}

function renderCustomerList(customers) {
  const list = document.getElementById('customerList');
  const empty = document.getElementById('emptyState');
  if (customers.length === 0) { list.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';

  list.innerHTML = customers.map(c => {
    const dl = c.days_left;
    let badge = '', badgeClass = '';
    if (dl !== null && dl <= 2 && dl >= 0) { badge = dl === 0 ? '今天' : `${dl}天后`; badgeClass = 'urgent'; }
    else if (dl !== null && dl > 0) { badge = `${dl}天后`; }
    else if (dl !== null && dl < 0) { badge = '已完成'; }

    let tags = [];
    try { tags = JSON.parse(c.style_tags || '[]'); } catch(e) {}
    const tagHtml = tags.slice(0,3).map(t => `<span class="tag">${t}</span>`).join('');
    const imgCount = (c.images || []).length;

    return `
      <div class="customer-card" onclick="openDetail('${c.id}')">
        <div class="customer-card-top">
          <span class="customer-name">${esc(c.name)}</span>
          ${badge ? `<span class="customer-badge ${badgeClass}">${badge}</span>` : ''}
        </div>
        <div class="customer-meta">
          <span>📅 ${c.wedding_date}</span>
          <span>📞 <a href="tel:${esc(c.phone)}" onclick="event.stopPropagation()">${esc(c.phone)}</a></span>
          ${imgCount > 0 ? `<span>📷 ${imgCount}</span>` : ''}
        </div>
        ${tagHtml ? `<div class="customer-tags">${tagHtml}</div>` : ''}
      </div>`;
  }).join('');
}

function renderCountdown(customers) {
  const container = document.getElementById('countdownContent');
  const upcoming = customers.filter(c => c.days_left !== null && c.days_left >= 0).sort((a,b) => a.days_left - b.days_left);
  if (upcoming.length === 0) {
    container.innerHTML = '<div class="countdown-none">暂无即将到来的跟妆，点击下方添加顾客</div>';
    return;
  }
  const c = upcoming[0];
  container.innerHTML = `
    <div class="countdown-name">${esc(c.name)}</div>
    <div class="countdown-days">${c.days_left}<small> 天</small></div>
    <div class="countdown-date">婚期：${c.wedding_date}${c.pickup_time ? ' · 接亲 ' + c.pickup_time : ''}</div>`;
}

// ============================================================
// 详情页
// ============================================================
function openDetail(customerId) {
  currentCustomerId = customerId;
  showPage('detail');
  const customers = loadCached();
  const c = customers.find(x => x.id === customerId);
  if (!c) { showToast('顾客不存在'); goHome(); return; }
  c.days_left = daysLeft(c.wedding_date);
  renderDetail(c);
}

function renderDetail(c) {
  let tags = [];
  try { tags = JSON.parse(c.style_tags || '[]'); } catch(e) {}
  const tagHtml = tags.map(t => `<span class="tag">${t}</span>`).join('');

  const dl = c.days_left;
  let reminderText = '';
  if (dl !== null && dl >= 0 && dl <= (c.reminder_days || 2)) {
    reminderText = `⚠️ 距离婚期还有 <strong>${dl}</strong> 天，请做好准备！`;
  } else if (dl !== null && dl > 0) {
    reminderText = `距离婚期还有 ${dl} 天`;
  } else if (dl !== null && dl <= 0) {
    reminderText = '婚期已过';
  }

  const images = c.images || [];
  const imgHtml = images.map((img, idx) => `
    <div class="image-item">
      <img src="${img.data}" alt="${esc(img.label)}" loading="lazy" onclick="viewImage('${img.data}')">
      <button class="image-item-delete" onclick="event.stopPropagation();deleteImage('${c.id}',${idx})">×</button>
      ${img.label ? `<div class="image-item-label">${esc(img.label)}</div>` : ''}
    </div>`).join('');

  document.getElementById('detailContent').innerHTML = `
    <div class="section-card">
      <div class="section-title">👰 顾客信息</div>
      <div class="info-row"><span class="info-label">姓名</span><span class="info-value">${esc(c.name)}</span></div>
      <div class="info-row"><span class="info-label">💒 婚期</span><span class="info-value">${c.wedding_date}</span></div>
      <div class="info-row"><span class="info-label">☎️ 电话</span><span class="info-value"><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></span></div>
      <div class="info-row"><span class="info-label">🏠 接亲地址</span><span class="info-value">${esc(c.pickup_address)}</span></div>
      <div class="info-row"><span class="info-label">⏰ 接亲时间</span><span class="info-value">${c.pickup_time || '未填写'}</span></div>
      <div class="info-row"><span class="info-label">🏠 典礼地址</span><span class="info-value">${esc(c.ceremony_address)}</span></div>
    </div>
    <div class="section-card">
      <div class="section-title">💄 顾客要求</div>
      ${tagHtml ? `<div class="customer-tags" style="margin-bottom:10px">${tagHtml}</div>` : ''}
      <div class="requirements-text">${esc(c.requirements || '暂无记录')}</div>
    </div>
    <div class="section-card">
      <div class="section-title">👗 礼服选择</div>
      <div class="image-grid">
        ${imgHtml}
        <div class="image-add" onclick="addImage('${c.id}')">+</div>
      </div>
    </div>
    <div class="section-card">
      <div class="section-title">⏰ 提醒设置</div>
      <div class="info-row"><span class="info-label">📅 提前提醒</span><span class="info-value">${c.reminder_days || 2} 天</span></div>
      <div style="margin-top:8px;font-size:14px;color:var(--text-secondary)">${reminderText}</div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="openForm('${c.id}')">✏️ 编辑</button>
      <button class="btn btn-danger" onclick="deleteCustomerFromDetail('${c.id}')">🗑 删除</button>
    </div>`;
}

// ============================================================
// 表单
// ============================================================
function resetForm() {
  document.getElementById('formCustomerId').value = '';
  document.getElementById('formName').value = '';
  document.getElementById('formWeddingDate').value = '';
  document.getElementById('formPhone').value = '';
  document.getElementById('formPickup').value = '';
  document.getElementById('formPickupTime').value = '07:00';
  document.getElementById('formCeremony').value = '';
  document.getElementById('formRequirements').value = '';
  document.getElementById('formReminderDays').value = '2';
  document.getElementById('formSaveBtn').textContent = '💾 保存顾客信息';
  document.getElementById('formDeleteBtn').style.display = 'none';
  selectedTags = [];
  document.querySelectorAll('.style-tag').forEach(el => el.classList.remove('selected'));
}

function loadCustomerToForm(customerId) {
  const customers = loadCached();
  const c = customers.find(x => x.id === customerId);
  if (!c) { showToast('顾客不存在'); return; }
  document.getElementById('formCustomerId').value = c.id;
  document.getElementById('formName').value = c.name;
  document.getElementById('formWeddingDate').value = c.wedding_date;
  document.getElementById('formPhone').value = c.phone;
  document.getElementById('formPickup').value = c.pickup_address;
  document.getElementById('formPickupTime').value = c.pickup_time || '07:00';
  document.getElementById('formCeremony').value = c.ceremony_address;
  document.getElementById('formRequirements').value = c.requirements || '';
  document.getElementById('formReminderDays').value = c.reminder_days || 2;
  document.getElementById('formSaveBtn').textContent = '💾 更新顾客信息';
  document.getElementById('formDeleteBtn').style.display = '';
  selectedTags = [];
  try { selectedTags = JSON.parse(c.style_tags || '[]'); } catch(e) {}
  document.querySelectorAll('.style-tag').forEach(el => {
    el.classList.toggle('selected', selectedTags.includes(el.dataset.tag));
  });
}

// Tag 点击
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('style-tag')) {
    e.target.classList.toggle('selected');
    const tag = e.target.dataset.tag;
    if (e.target.classList.contains('selected')) {
      if (!selectedTags.includes(tag)) selectedTags.push(tag);
    } else {
      selectedTags = selectedTags.filter(t => t !== tag);
    }
  }
});

async function saveCustomer() {
  const id = document.getElementById('formCustomerId').value;
  const data = {
    id: id || genId(),
    name: document.getElementById('formName').value.trim(),
    wedding_date: document.getElementById('formWeddingDate').value,
    phone: document.getElementById('formPhone').value.trim(),
    pickup_address: document.getElementById('formPickup').value.trim(),
    pickup_time: document.getElementById('formPickupTime').value,
    ceremony_address: document.getElementById('formCeremony').value.trim(),
    requirements: document.getElementById('formRequirements').value.trim(),
    style_tags: JSON.stringify(selectedTags),
    reminder_days: parseInt(document.getElementById('formReminderDays').value),
    created_at: new Date().toISOString()
  };

  if (!data.name || !data.wedding_date || !data.phone || !data.pickup_address || !data.ceremony_address) {
    showToast('请填写所有必填字段'); return;
  }

  let customers = await loadAll();

  if (id) {
    const idx = customers.findIndex(x => x.id === id);
    if (idx === -1) { showToast('顾客不存在'); return; }
    data.images = customers[idx].images || [];
    data.created_at = customers[idx].created_at;
    customers[idx] = data;
  } else {
    data.images = [];
    customers.push(data);
  }

  await saveAll(customers);
  showToast(id ? '更新成功' : '创建成功');
  autoBackup(); // 自动备份
  currentCustomerId = data.id;
  openDetail(data.id);
}

// ============================================================
// 删除
// ============================================================
function deleteCustomerFromDetail(cid) {
  if (!confirm('确定要删除这位顾客的所有记录吗？此操作不可恢复。')) return;
  let customers = loadCached();
  customers = customers.filter(x => x.id !== cid);
  saveAll(customers);
  showToast('已删除');
  autoBackup();
  goHome();
}

function deleteCustomer() {
  const id = document.getElementById('formCustomerId').value;
  if (!id) return;
  if (!confirm('确定要删除这位顾客的所有记录吗？此操作不可恢复。')) return;
  let customers = loadCached();
  customers = customers.filter(x => x.id !== id);
  saveAll(customers);
  showToast('已删除');
  autoBackup();
  goHome();
}

// ============================================================
// 图片操作（Base64 存储）
// ============================================================
function viewImage(dataUrl) {
  document.getElementById('modalImage').src = dataUrl;
  document.getElementById('imageModal').classList.add('active');
}

function closeModal() {
  document.getElementById('imageModal').classList.remove('active');
}

function addImage(customerId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    // 压缩大图避免撑爆 localStorage
    compressAndStore(file, customerId);
  };
  input.click();
}

function compressAndStore(file, customerId) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 800, maxH = 1200;
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      if (h > maxH) { w = w * maxH / h; h = maxH; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      const label = prompt('图片备注（如：出门纱 / 主婚纱 / 敬酒服）：', '') || '';

      let customers = loadCached();
      const c = customers.find(x => x.id === customerId);
      if (c) {
        if (!c.images) c.images = [];
        c.images.push({ data: dataUrl, label: label, addedAt: new Date().toISOString() });
        saveAll(customers);
        showToast('图片已保存');
        openDetail(customerId);
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function deleteImage(customerId, imgIndex) {
  if (!confirm('确定删除这张图片吗？')) return;
  let customers = loadCached();
  const c = customers.find(x => x.id === customerId);
  if (c && c.images) {
    c.images.splice(imgIndex, 1);
    saveAll(customers);
    showToast('图片已删除');
    openDetail(customerId);
  }
}

// ============================================================
// 数据导出 / 导入
// ============================================================
function exportData() {
  const data = localStorage.getItem(STORAGE_KEY);
  if (!data) { showToast('没有数据可导出'); return; }
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '跟妆工作台_备份_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('备份文件已下载');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!Array.isArray(data)) throw new Error('格式错误');
        if (!confirm(`即将导入 ${data.length} 条顾客记录，现有数据将被覆盖，确定吗？`)) return;
        saveAll(data);
        showToast('数据已导入');
        loadCustomers();
      } catch(err) {
        showToast('导入失败，文件格式不正确');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ============================================================
// 键盘
// ============================================================
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('imageModal').classList.contains('active')) closeModal();
    else if (currentPage === 'detail' || currentPage === 'form') goHome();
  }
});

// ============================================================
// 初始化
// ============================================================
showPage('home');
loadCustomers();

// 注册 Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register(
    URL.createObjectURL(new Blob([`
      const CACHE = 'mw-v2';
      self.addEventListener('install', e => { self.skipWaiting(); });
      self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
      self.addEventListener('fetch', e => {
        e.respondWith(
          caches.match(e.request).then(r => r || fetch(e.request).then(res => {
            if(res.ok){ const clone = res.clone(); caches.open(CACHE).then(c => c.put(e.request, clone)); }
            return res;
          }))
        );
      });
    `], {type:'text/javascript'}))
  ).catch(()=>{});
}
